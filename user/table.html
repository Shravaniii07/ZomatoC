<!DOCTYPE html>
<html>
<head>
    <title>Dashboard | Zomato</title>
    <link rel="stylesheet" href="table.css">
</head>
<body>


<div class="topbar">
    <h2>Zomato Admin Panel</h2>
    <a href="../index.html">Logout</a>
</div>

<div class="container">

    <h3>Manage Restaurants</h3>

   
    <button class="add-btn">+ Add New</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Location</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Dominos Pizza</td>
                <td>Delivery</td>
                <td>Pune</td>
                <td class="open">Open</td>
                <td>
                    <button class="edit">Edit</button>
                    <button class="delete">Delete</button>
                </td>
            </tr>

            <tr>
                <td>2</td>
                <td>Kiki Restaurant</td>
                <td>Dining</td>
                <td>Pune</td>
                <td class="closed">Closed</td>
                <td>
                    <button class="edit">Edit</button>
                    <button class="delete">Delete</button>
                </td>
            </tr>

            
        </tbody>
    </table>

</div>

</body>
</html>
