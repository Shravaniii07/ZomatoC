<!DOCTYPE html>
<html>
<head>
    <title>Dashboard | Zomato</title>
    <link rel="stylesheet" href="table.css">
    <style>
        
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background-color: #fff5f6;
}

/* TOP BAR */
.topbar {
    background-color: #e23744;
    color: white;
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.topbar a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

/* MAIN CONTAINER */
.container {
    padding: 40px;
}

/* TITLE */
.container h3 {
    margin-bottom: 20px;
    font-size: 24px;
}

/* ADD BUTTON */
.add-btn {
    background-color: #e23744;
    color: white;
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 15px;
}

.add-btn:hover {
    background-color: #c91c2a;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    background-color: white;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    border-radius: 10px;
    overflow: hidden;
}

thead {
    background-color: #f4f4f4;
}

th, td {
    padding: 14px;
    text-align: left;
}

th {
    font-weight: bold;
}

tr:nth-child(even) {
    background-color: #fafafa;
}

/* STATUS */
.open {
    color: green;
    font-weight: bold;
}

.closed {
    /* color: red; */
    font-weight: bold;
}

/* ACTION BUTTONS */
.edit {
    background-color: #4caf50;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
}

.delete {
    background-color: #e23744;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
}

    </style>
</head>
<body>


<div class="topbar">
    <h2>Zomato Admin Panel</h2>
    <a href="../index.html">Logout</a>
</div>

<div class="container">

    <h3>Manage Restaurants</h3>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Order</th>
                <th>Location</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Dominos Pizza</td>
                <td>Choco Lava Cake</td>
                <td>Pune</td>
                <td>Order Delivered</td>
                <td>
                    <button class="edit">Track</button>
                    
                </td>
            </tr>

            <tr>
                <td>2</td>
                <td>Kiki Restaurant</td>
                <td>Dining</td>
                <td>Pune</td>
                <td class="closed">Preparing Order</td>
                <td>
                    <button class="edit">Track</button>
             
                </td>
            </tr>

            
        </tbody>
    </table>

</div>

</body>
</html>
