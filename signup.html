<html>

<head>
    <title>Signup</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>
    <center>
        <br><br>
        <div class="container">
            <h2>Sign up</h2>
            <input id="signup-name" type="text" name="fname" placeholder="Full Name">
            <br><br>

            <input id="signup-email" type="email" name="Email" placeholder="Email or Phone">
            <br><br>

            <input id="signup-password" type="password" placeholder="Password">
            <br><br>

            <input type="checkbox" value="agree">I agree to Zomato's Terms of Service,Privacy Policy and Content
            Policies
            <br><br>
            <button type="button" id="signup-btn">Create account</button>
            <br><br>
            <hr>
            <button type="button" id="google-signup-btn">Sign in with Google</button>
            <br><br>
            <hr>
            <p>Already have an account? <a href="login.html">Log in</a></p>

        </div>
    </center>
    <script src="storage.js"></script>
    <script src="auth_logic.js"></script>
</body>

</html>
