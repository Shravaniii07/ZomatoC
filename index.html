<!DOCTYPE html>
<html>
<head>
    <title>Zomato | Discover the best food</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <a href="index.html" class="brand-logo" style="color: #E23744;">zomato</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="#">Login</a>
        <a href="#">Sign Up</a>
    </div>
</nav>

<!-- HERO SECTION -->
<div class="hero">

    <!-- VIDEO BACKGROUND -->
    <video autoplay loop muted playsinline class="hero-video">
        <source src="static/images/startingfoodvideo.mp4" type="video/mp4">
    </video>

    <div class="hero-overlay"></div>

    <div class="hero-content">
        <h1>Discover the best food & drinks in your city</h1>

        <!-- SEARCH BOX -->
        <div class="search-box">
            <select>
                <option>Pune</option>
                <option>Mumbai</option>
                <option>Delhi</option>
            </select>
            <input type="text" placeholder="Search for restaurant, cuisine or a dish">
        </div>
    </div>
</div>

<!-- OPTIONS -->
<div class="options">

    <div class="option-card">
        <a href="#">
            <img src="static/images/online.avif">
            <div class="card-content">
                <h3>Order Online</h3>
                <p>Stay home and order to your doorstep</p>
            </div>
        </a>
    </div>

    <div class="option-card">
        <a href="#">
            <img src="static/images/dining.webp">
            <div class="card-content">
                <h3>Dining</h3>
                <p>View the city’s favourite dining venues</p>
            </div>
        </a>
    </div>

    <div class="option-card">
        <a href="#">
            <img src="static/images/nightlife.webp">
            <div class="card-content">
                <h3>Nightlife & Clubs</h3>
                <p>Explore the city’s top nightlife outlets</p>
            </div>
        </a>
    </div>

</div>

</body>
</html>
