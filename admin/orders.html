<!DOCTYPE html>
<html>

<head>
    <title>Manage Orders | Zomato Admin</title>
    <link rel="stylesheet" href="restraurants.css">
</head>

<body>

    <div class="topbar">
        <h2>Zomato Admin - Orders</h2>
        <a href="admin-dashboard.html">Back to Dashboard</a>
    </div>

    <div class="container">
        <h3>Current Orders</h3>
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="orders-table">
                <!-- Dynamic content -->
            </tbody>
        </table>
    </div>

    <script src="../storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const table = document.getElementById('orders-table');
            function render() {
                const orders = db.getOrders();
                table.innerHTML = '';
                orders.forEach(order => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                    <td>${order.id}</td>
                    <td>${order.items.map(i => i.name).join(', ') || 'N/A'}</td>
                    <td>₹${order.total}</td>
                    <td>${order.status}</td>
                    <td>${order.date}</td>
                    <td>
                        <button class="edit" onclick="updateStatus('${order.id}')">Update</button>
                    </td>
                `;
                    table.appendChild(tr);
                });
            }
            window.updateStatus = (id) => {
                const orders = db.getOrders();
                const order = orders.find(o => o.id === id);
                const status = prompt('Enter new status (Placed/Delivered/Cancelled):', order.status);
                if (status) {
                    order.status = status;
                    db.setData(STORAGE_KEYS.ORDERS, orders);
                    render();
                }
            };
            render();
        });
    </script>
</body>

</html>
