<!DOCTYPE html>
<html>

<head>
    <title>Manage Bookings | Zomato Admin</title>
    <link rel="stylesheet" href="restraurants.css">
</head>

<body>

    <div class="topbar">
        <h2>Zomato Admin - Bookings</h2>
        <a href="admin-dashboard.html">Back to Dashboard</a>
    </div>

    <div class="container">
        <h3>Table Bookings</h3>
        <table>
            <thead>
                <tr>
                    <th>Booking ID</th>
                    <th>User</th>
                    <th>Guests</th>
                    <th>Time</th>
                    <th>Action</th>
                </tr>

                <tr>
                    <td>A563</td>
                    <td>Naitik</td>
                    <td>5 Guest</td>
                    <td>8:00 PM</td>
                    <td>Reserved</td>
                </tr>

                  <tr>
                    <td>D903</td>
                    <td>Varun</td>
                    <td>2 Guest</td>
                    <td>9:00 PM</td>
                    <td>Reserved</td>
                </tr>

                  <tr>
                    <td>R413</td>
                    <td>Priya</td>
                    <td>4 Guest</td>
                    <td>8:00 PM</td>
                    <td>Reserved</td>
                </tr>
            </thead>
            <tbody id="bookings-table">
                <!-- Dynamic -->
            </tbody>
        </table>
    </div>

    <script src="../storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const table = document.getElementById('bookings-table');
            function render() {
                const list = db.getBookings();
                table.innerHTML = '';
                list.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.user || 'Guest'}</td>
                    <td>${item.guests || 2}</td>
                    <td>${item.time || 'Default'}</td>
                    <td>
                        <button class="delete" onclick="deleteBooking('${item.id}')">Cancel</button>
                    </td>
                `;
                    table.appendChild(tr);
                });
            }
            window.deleteBooking = (id) => {
                if (confirm('Cancel booking?')) {
                    const list = db.getBookings().filter(b => b.id !== id);
                    db.setData(STORAGE_KEYS.BOOKINGS, list);
                    render();
                }
            };
            render();
        });
    </script>
</body>

</html>
